<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAGNARÖK — Calibração das 4 Mecânicas Base</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Barra Superior Minimalista -->
    <header id="top-bar">
      <div class="brand">
        <span class="game-title">RAGNARÖK: ECHOES OF TIME</span>
        <span class="phase-tag">CALIBRAÇÃO DE SPRITES</span>
      </div>

      <!-- Guia de Controles dos 4 Eixos + Pulo + Ataque -->
      <div class="mechanics-guide">
        <span class="guide-item"><kbd>A</kbd> <kbd>D</kbd> <b>X (Frente/Trás)</b></span>
        <span class="guide-item"><kbd>W</kbd> <kbd>S</kbd> <b>Y (Profundidade)</b></span>
        <span class="guide-item"><kbd>Espaço</kbd> <b>Pular (Z)</b></span>
        <span class="guide-item"><kbd>J</kbd> <b>Golpe / Pogo (↓+J)</b></span>
      </div>
    </header>

    <!-- Canvas Central Phaser 3 -->
    <main id="game-container"></main>

    <!-- Telemetria Discreta no Canto Inferior Direito -->
    <aside id="controls-hud">
      <div class="hud-card telemetry">
        <h3>📊 Telemetria em Tempo Real</h3>
        <div id="telemetry-info">Carregando telemetria...</div>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
